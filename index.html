<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chic Fool - store</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-deep:#EAF6FC;
    --card:#F4F4F4;
    --ink:#1A1A1A;
    --ink-soft:#545454;
    --ink-faint:#A2A2A2;
    --line:#DCDCDC;
    --line-dark:#A2A2A2;
    --accent:#27A6DE;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:"Courier New",Courier,ui-monospace,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
    --head-h:64px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden;}
  ::selection{background:var(--accent);color:var(--paper);}
  button,a,input{font:inherit;color:inherit;}
  button{background:none;border:0;cursor:pointer;}
  a{text-decoration:none;}
  :focus-visible{outline:1px solid var(--accent);outline-offset:4px;}

  .site-head{
    position:sticky;top:0;z-index:50;height:var(--head-h);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:0 clamp(1rem,3vw,2rem);background:rgba(255,255,255,.94);
    border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
  }
  .brand{
    display:inline-flex;align-items:center;width:clamp(9.5rem,13vw,14rem);
  }
  .brand img{
    display:block;width:100%;height:auto;
  }
  .nav,.tools{display:flex;align-items:center;gap:clamp(.8rem,2vw,1.35rem);}
  .nav{justify-self:center;}
  .tools{justify-self:end;}
  .nav a,.tools button,.tools a{
    font-family:var(--mono);
    font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);
    transition:color .25s var(--ease);
  }
  .nav a:hover,.tools button:hover,.tools a:hover{color:var(--accent);}

  main{padding:clamp(3.5rem,7vw,6rem) clamp(1rem,3vw,2rem) 4rem;}
  .shop-head{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    max-width:1600px;margin:0 auto clamp(1.25rem,2.2vw,2rem);
  }
  .shop-title{
    font-family:var(--mono);font-weight:400;font-size:.68rem;
    line-height:1;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);
  }
  .filters{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;justify-content:flex-end;}
  .filter{
    font-family:var(--mono);
    min-height:2rem;padding:.36rem .72rem;border:1px solid var(--line);
    font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
    transition:border-color .25s var(--ease),background .25s var(--ease),color .25s var(--ease);
  }
  .filter:hover,.filter.is-active{border-color:var(--accent);background:var(--accent);color:var(--paper);}

  .grid{
    max-width:1600px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(1.1rem,2.2vw,2rem) clamp(.9rem,1.6vw,1.35rem);
  }
  .product{
    display:flex;flex-direction:column;gap:.72rem;text-align:left;
  }
  .thumb{
    position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--card);
    border:1px solid var(--line);
  }
  .thumb::before{
    content:"";position:absolute;inset:0;background:var(--bg);opacity:.96;
    transition:transform .7s var(--ease),opacity .7s var(--ease);
  }
  .thumb-logo{
    position:absolute;inset:0;z-index:1;
    background:url("assets/chicfool-line-logo.png") center/42% auto no-repeat;
    opacity:.16;
  }
  .product:hover .thumb::before{transform:scale(1.025);opacity:1;}
  .badge{
    font-family:var(--mono);
    position:absolute;left:.75rem;top:.75rem;z-index:2;background:var(--ink);color:var(--paper);
    padding:.28rem .5rem;font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;
  }
  .meta{
    display:grid;grid-template-columns:1fr auto;gap:.35rem .8rem;align-items:start;
  }
  .name{
    font-size:clamp(.96rem,1.25vw,1.12rem);font-weight:400;line-height:1.2;
  }
  .price{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft);white-space:nowrap;}
  .line{
    font-family:var(--mono);
    grid-column:1/-1;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);
  }

  .drawer{
    position:fixed;inset:0;z-index:90;pointer-events:none;
  }
  .drawer.is-open{pointer-events:auto;}
  .shade{
    position:absolute;inset:0;background:rgba(26,26,26,.16);opacity:0;
    transition:opacity .35s var(--ease);
  }
  .drawer.is-open .shade{opacity:1;}
  .panel{
    position:absolute;right:0;top:0;height:100%;width:min(520px,100%);
    background:var(--paper);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .42s var(--ease);
    display:flex;flex-direction:column;
  }
  .drawer.is-open .panel{transform:translateX(0);}
  .panel-head{
    height:var(--head-h);display:flex;align-items:center;justify-content:space-between;
    padding:0 1rem;border-bottom:1px solid var(--line);
  }
  .panel-head h2{
    font-family:var(--mono);font-size:.72rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;
  }
  .close{
    width:2.5rem;height:2.5rem;border:1px solid var(--line);font-size:1.25rem;line-height:1;
  }
  .panel-body{flex:1;overflow:auto;padding:1rem;}

  .detail-image{
    position:relative;aspect-ratio:3/4;background:var(--card);border:1px solid var(--line);overflow:hidden;
  }
  .detail-image::before{content:"";position:absolute;inset:0;background:var(--bg);}
  .detail-image::after{
    content:"";position:absolute;inset:0;
    background:url("assets/chicfool-line-logo.png") center/44% auto no-repeat;
    opacity:.16;
  }
  .detail-meta{padding:1rem 0 0;}
  .detail-meta h3{font-size:1.6rem;font-weight:400;line-height:1.15;}
  .detail-row{
    font-family:var(--mono);
    display:flex;justify-content:space-between;gap:1rem;margin-top:.75rem;
    font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  }
  .option-label{
    font-family:var(--mono);
    display:block;margin:1.4rem 0 .55rem;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);
  }
  .sizes{display:flex;gap:.5rem;flex-wrap:wrap;}
  .size{
    font-family:var(--mono);
    min-width:3.3rem;height:2.35rem;border:1px solid var(--line);font-size:.68rem;
    letter-spacing:.16em;text-transform:uppercase;
  }
  .size.is-active{border-color:var(--accent);background:var(--accent);color:var(--paper);}
  .add{
    font-family:var(--mono);
    width:100%;height:3.25rem;margin-top:1.4rem;background:var(--accent);color:var(--paper);
    font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;
  }
  .add:disabled{background:var(--line-dark);cursor:not-allowed;}

  .bag-items{display:flex;flex-direction:column;border-top:1px solid var(--line);}
  .bag-row{
    display:grid;grid-template-columns:4.5rem 1fr auto;gap:.75rem;padding:1rem 0;
    border-bottom:1px solid var(--line);
  }
  .bag-thumb{aspect-ratio:3/4;background:var(--card);border:1px solid var(--line);}
  .bag-thumb div{width:100%;height:100%;background:var(--bg);}
  .bag-name{font-size:1rem;line-height:1.2;}
  .bag-sub{font-family:var(--mono);margin-top:.2rem;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);}
  .bag-price{font-family:var(--mono);font-size:.65rem;white-space:nowrap;color:var(--ink-soft);}
  .qty{display:flex;align-items:center;gap:.55rem;margin-top:.8rem;}
  .qty button{width:1.7rem;height:1.7rem;border:1px solid var(--line);}
  .empty{padding:2rem 0;font-size:1rem;color:var(--ink-soft);}
  .summary{
    margin-top:auto;padding:1rem;border-top:1px solid var(--line);
  }
  .summary-row{
    font-family:var(--mono);
    display:flex;justify-content:space-between;margin-bottom:1rem;
    font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  }
  .checkout{
    font-family:var(--mono);
    width:100%;height:3.25rem;border:1px solid var(--accent);background:var(--accent);color:var(--paper);
    font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;
  }
  .checkout:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed;}

  footer{
    font-family:var(--mono);
    padding:2rem clamp(1rem,3vw,2rem);border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);
  }
  footer a:hover{color:var(--accent);}

  @media (max-width:980px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .shop-head{align-items:start;flex-direction:column;}
    .filters{justify-content:flex-start;}
  }
  @media (max-width:680px){
    .site-head{grid-template-columns:1fr auto;height:58px;}
    .brand{width:9.3rem;}
    .nav{display:none;}
    .tools a{display:none;}
    main{padding:2.8rem .85rem 3rem;}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.15rem .7rem;}
    .shop-title{font-size:.62rem;}
    .name{font-size:1.02rem;}
    .price{grid-column:1/-1;}
    .panel{width:100%;}
  }
</style>
</head>
<body>
  <header class="site-head">
    <a class="brand" href="#shop" aria-label="Chic Fool">
      <img src="assets/chicfool-line-logo.png" alt="Chic Fool">
    </a>
    <nav class="nav" aria-label="Store navigation">
      <a href="#shop">Shop</a>
      <a href="privacy.html">Privacy</a>
    </nav>
    <div class="tools">
      <a href="https://www.instagram.com/chicfool" rel="noreferrer">Instagram</a>
      <button type="button" id="bagButton">Bag <span id="bagCount">0</span></button>
    </div>
  </header>

  <main id="shop">
    <div class="shop-head">
      <h1 class="shop-title">Shop</h1>
      <div class="filters" aria-label="Product filters">
        <button class="filter is-active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="seasonal">Seasonal</button>
        <button class="filter" type="button" data-filter="permanent">Permanent</button>
      </div>
    </div>
    <section class="grid" id="productGrid" aria-label="Products"></section>
  </main>

  <footer>
    <span>Tokyo</span>
    <a href="privacy.html">Privacy</a>
    <span>(c) 2026 Chic Fool</span>
  </footer>

  <aside class="drawer" id="productDrawer" aria-hidden="true">
    <button class="shade" type="button" data-close="product" aria-label="Close product"></button>
    <section class="panel" role="dialog" aria-modal="true" aria-label="Product detail">
      <div class="panel-head">
        <h2>Item</h2>
        <button class="close" type="button" data-close="product" aria-label="Close">X</button>
      </div>
      <div class="panel-body" id="productDetail"></div>
    </section>
  </aside>

  <aside class="drawer" id="bagDrawer" aria-hidden="true">
    <button class="shade" type="button" data-close="bag" aria-label="Close bag"></button>
    <section class="panel" role="dialog" aria-modal="true" aria-label="Shopping bag">
      <div class="panel-head">
        <h2>Bag</h2>
        <button class="close" type="button" data-close="bag" aria-label="Close">X</button>
      </div>
      <div class="panel-body">
        <div class="bag-items" id="bagItems"></div>
      </div>
      <div class="summary">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">JPY 0</span></div>
        <button class="checkout" id="checkoutButton" type="button" disabled>Checkout</button>
      </div>
    </section>
  </aside>

  <script>
    var products = [
      {id:'aaa', name:'aaa', line:'permanent', price:12000, sizes:['S','M','L'], status:'available'},
      {id:'after-rain-tee', name:'After-rain tee', line:'seasonal', price:9000, sizes:['S','M','L'], status:'available'},
      {id:'type-shirt', name:'Type shirt', line:'seasonal', price:14000, sizes:['S','M','L'], status:'sold'},
      {id:'base-pants', name:'Base pants', line:'permanent', price:18000, sizes:['S','M','L'], status:'available'},
      {id:'quiet-jacket', name:'Quiet jacket', line:'seasonal', price:28000, sizes:['M','L'], status:'sold'},
      {id:'field-bag', name:'Field bag', line:'permanent', price:9000, sizes:['One'], status:'available'},
      {id:'blanket-hoodie', name:'Blanket hoodie', line:'seasonal', price:22000, sizes:['S','M','L'], status:'available'},
      {id:'paper-dry-cloth', name:'Paper-dry cloth', line:'permanent', price:16000, sizes:['S','M','L'], status:'available'}
    ];
    var bag = [];
    var selectedProduct = null;
    var selectedSize = null;

    function yen(value){
      return 'JPY ' + value.toLocaleString('en-US');
    }
    function phStyle(index){
      var a = (index * 41) % 360;
      return 'linear-gradient('+a+'deg,#FFFFFF 0%,#F4F4F4 58%,#EAF6FC 100%)';
    }
    function productBg(product){
      return phStyle(products.findIndex(function(p){ return p.id === product.id; }));
    }
    function renderProducts(filter){
      var grid = document.getElementById('productGrid');
      var visible = products.filter(function(product){
        return filter === 'all' || product.line === filter;
      });
      grid.innerHTML = visible.map(function(product){
        return '<button class="product" type="button" data-id="'+product.id+'">'+
          '<span class="thumb" style="--bg:'+productBg(product)+'">'+
            '<span class="thumb-logo" aria-hidden="true"></span>'+
            (product.status === 'sold' ? '<span class="badge">Sold out</span>' : '')+
          '</span>'+
          '<span class="meta">'+
            '<span class="name">'+product.name+'</span>'+
            '<span class="price">'+yen(product.price)+'</span>'+
            '<span class="line">'+product.line+'</span>'+
          '</span>'+
        '</button>';
      }).join('');
      grid.querySelectorAll('.product').forEach(function(button){
        button.addEventListener('click', function(){
          openProduct(button.getAttribute('data-id'));
        });
      });
    }
    function openDrawer(id){
      document.getElementById(id).classList.add('is-open');
      document.getElementById(id).setAttribute('aria-hidden','false');
      document.body.classList.add('locked');
    }
    function closeDrawer(id){
      document.getElementById(id).classList.remove('is-open');
      document.getElementById(id).setAttribute('aria-hidden','true');
      if(!document.querySelector('.drawer.is-open')) document.body.classList.remove('locked');
    }
    function openProduct(id){
      selectedProduct = products.find(function(product){ return product.id === id; });
      selectedSize = selectedProduct.sizes[0];
      renderProductDetail();
      openDrawer('productDrawer');
    }
    function renderProductDetail(){
      var wrap = document.getElementById('productDetail');
      var disabled = selectedProduct.status === 'sold';
      wrap.innerHTML =
        '<div class="detail-image" style="--bg:'+productBg(selectedProduct)+'"></div>'+
        '<div class="detail-meta">'+
          '<h3>'+selectedProduct.name+'</h3>'+
          '<div class="detail-row"><span>'+selectedProduct.line+'</span><span>'+yen(selectedProduct.price)+'</span></div>'+
          '<span class="option-label">Size</span>'+
          '<div class="sizes">'+selectedProduct.sizes.map(function(size){
            return '<button class="size'+(size===selectedSize?' is-active':'')+'" type="button" data-size="'+size+'">'+size+'</button>';
          }).join('')+'</div>'+
          '<button class="add" type="button" id="addToBag" '+(disabled?'disabled':'')+'>'+(disabled?'Sold out':'Add to bag')+'</button>'+
        '</div>';
      wrap.querySelectorAll('.size').forEach(function(button){
        button.addEventListener('click', function(){
          selectedSize = button.getAttribute('data-size');
          renderProductDetail();
        });
      });
      var add = document.getElementById('addToBag');
      if(add){
        add.addEventListener('click', function(){
          addToBag(selectedProduct, selectedSize);
          closeDrawer('productDrawer');
          openDrawer('bagDrawer');
        });
      }
    }
    function addToBag(product, size){
      var found = bag.find(function(item){ return item.id === product.id && item.size === size; });
      if(found){ found.qty += 1; }
      else { bag.push({id:product.id, size:size, qty:1}); }
      renderBag();
    }
    function changeQty(id, size, delta){
      bag = bag.map(function(item){
        if(item.id === id && item.size === size) item.qty += delta;
        return item;
      }).filter(function(item){ return item.qty > 0; });
      renderBag();
    }
    function renderBag(){
      var wrap = document.getElementById('bagItems');
      var subtotal = 0;
      var count = 0;
      if(!bag.length){
        wrap.innerHTML = '<div class="empty">Empty.</div>';
      } else {
        wrap.innerHTML = bag.map(function(item){
          var product = products.find(function(p){ return p.id === item.id; });
          subtotal += product.price * item.qty;
          count += item.qty;
          return '<article class="bag-row">'+
            '<div class="bag-thumb"><div style="--bg:'+productBg(product)+'"></div></div>'+
            '<div><div class="bag-name">'+product.name+'</div><div class="bag-sub">'+item.size+'</div>'+
            '<div class="qty"><button type="button" data-qty="-1" data-id="'+item.id+'" data-size="'+item.size+'">-</button><span>'+item.qty+'</span><button type="button" data-qty="1" data-id="'+item.id+'" data-size="'+item.size+'">+</button></div></div>'+
            '<div class="bag-price">'+yen(product.price * item.qty)+'</div>'+
          '</article>';
        }).join('');
      }
      document.getElementById('bagCount').textContent = count;
      document.getElementById('subtotal').textContent = yen(subtotal);
      document.getElementById('checkoutButton').disabled = bag.length === 0;
      wrap.querySelectorAll('[data-qty]').forEach(function(button){
        button.addEventListener('click', function(){
          changeQty(button.getAttribute('data-id'), button.getAttribute('data-size'), Number(button.getAttribute('data-qty')));
        });
      });
    }

    document.querySelectorAll('.filter').forEach(function(button){
      button.addEventListener('click', function(){
        document.querySelectorAll('.filter').forEach(function(item){ item.classList.remove('is-active'); });
        button.classList.add('is-active');
        renderProducts(button.getAttribute('data-filter'));
      });
    });
    document.getElementById('bagButton').addEventListener('click', function(){ openDrawer('bagDrawer'); });
    document.querySelectorAll('[data-close="product"]').forEach(function(button){
      button.addEventListener('click', function(){ closeDrawer('productDrawer'); });
    });
    document.querySelectorAll('[data-close="bag"]').forEach(function(button){
      button.addEventListener('click', function(){ closeDrawer('bagDrawer'); });
    });
    document.addEventListener('keydown', function(event){
      if(event.key === 'Escape'){
        closeDrawer('productDrawer');
        closeDrawer('bagDrawer');
      }
    });
    document.getElementById('checkoutButton').addEventListener('click', function(){
      alert('Checkout will be connected here.');
    });
    renderProducts('all');
    renderBag();
  </script>
</body>
</html>
